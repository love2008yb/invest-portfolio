name: 每日数据更新与部署

# 触发方式：
#   1. 每个交易日 21:40（北京时间 = UTC 13:40）自动运行
#   2. 推送到 main 分支时（代码修改后立即重新部署）
#   3. 支持在 Actions 页面手动触发（Run workflow）
on:
  schedule:
    - cron: "40 13 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write    # 提交数据更新
  pages: write       # 部署到 GitHub Pages
  id-token: write    # Pages 部署必需

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖并更新数据
        run: |
          pip install requests
          python scripts/update_data.py

      - name: 提交数据变更
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet src/data/portfolio.json; then
            echo "数据无变化（可能为非交易日），跳过部署"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add src/data/portfolio.json
            git commit -m "chore: 每日数据更新 $(date -u +'%Y-%m-%d')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 推送持仓日报到微信（Server酱）
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          SCT_SENDKEY: ${{ secrets.SCT_SENDKEY }}
        run: python scripts/notify_wechat.py

      - name: 安装 Node.js
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装依赖
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          command: npm install --no-audit --no-fund

      - name: 构建网站
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        run: npm run build

      - name: 配置 Pages
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 部署到 GitHub Pages
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        id: deployment
        uses: actions/deploy-pages@v4
