name: Auto Update Portfolio Data

on:
  schedule:
    - cron: '35 7 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'src/data/portfolio_data.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "portfolio-update"
  cancel-in-progress: true

jobs:
  update-data:
    name: 更新基金净值数据
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_data_update != 'true'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests beautifulsoup4

      - name: 读取用户数据
        env:
          USER_DATA: ${{ secrets.USER_DATA_JSON }}
        run: |
          echo "$USER_DATA" > user_data.json
          echo "✓ 用户数据已解密"

      - name: 爬取天天基金网净值
        run: |
          python scripts/update_data.py --user-data user_data.json --output src/data/portfolio_data.json

      - name: 清理临时文件
        run: rm -f user_data.json

      - name: 检查数据变更
        id: check_changes
        run: |
          if git diff --quiet src/data/portfolio_data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 提交数据更新
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/data/portfolio_data.json
          git commit -m "auto: 更新基金净值数据 $(date +'%Y-%m-%d %H:%M')"
          git push

  build-and-deploy:
    name: 构建并部署
    needs: update-data
    if: always() && (needs.update-data.result == 'success' || needs.update-data.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装npm依赖
        run: npm install

      - name: 验证数据文件
        run: |
          if [ ! -f "src/data/portfolio_data.json" ]; then
            echo "创建默认数据文件"
            echo '{}' > src/data/portfolio_data.json
          fi

      - name: 构建项目
        run: npm run build

      - name: 配置GitHub Pages
        uses: actions/configure-pages@v4

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 部署到GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
